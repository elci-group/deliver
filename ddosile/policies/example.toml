ddosile = "0.0.1"
epoch = 1

[architecture]
mode = "permanent_facade"
origin_public_access = "forbidden"

[resources]
production_reserve_percent = 65
synthetic_capacity_percent = 15
operational_headroom_percent = 20

[[routes]]
path = "/docs/"
method = "GET"
class = "public_read"
synthetic = "static_only"
uncertainty = "challenge"

[[routes]]
path = "/account/"
method = "GET"
class = "authenticated"
synthetic = "forbidden"
uncertainty = "challenge"

[[routes]]
path = "/payments/"
method = "POST"
class = "consequential"
synthetic = "forbidden"
uncertainty = "reject"
