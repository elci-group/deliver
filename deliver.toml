[[file]]
path = "src/lib.rs"
required = true
forbid_regex = ["TODO", "FIXME", "unimplemented!"]

[[file]]
path = "src/main.rs"
required = true
forbid_regex = ["TODO", "FIXME", "unimplemented!"]

[[file]]
path = "Cargo.toml"
required = true

[[file]]
path = "README.md"
required = true
min_size_bytes = 1200
require_regex = [
  "deliver --spec",
  "--allow-commands",
  "Output Modes",
  "Spec Reference",
  "deliver init",
  "deliver validate",
  "deliver completions",
  "deliver schema",
  "extends",
  "--jobs",
  "format sarif",
  "format junit",
  "Check Weights",
  "weight = 4.0",
  "complete by weight",
  "Conditional Checks",
  "file_exists",
  "Incremental Validation and Caching",
  "--incremental",
  "--cache-dir",
  "Fail-Fast",
  "Streaming NDJSON",
  "--format ndjson",
  "GitHub Actions Annotations",
  "--format github",
  "Deliverable Attestations",
  "--attest",
  "attest verify",
  "forbid_secrets",
  "SBOM Check",
  "Plugin Checks",
  "--allow-commands",
  "Documentation & Stability",
  "CHANGELOG.md",
  "Semantic Versioning",
]

[[file]]
path = "man/deliver.1"
required = true
min_size_bytes = 900
require_regex = [
  "\\.TH DELIVER 1",
  "--color",
  "--progress",
  "\\.SH COMMANDS",
  "--jobs",
  "SARIF 2\\.1\\.0",
  "JUnit XML",
  "CONDITIONAL CHECKS",
  "--incremental",
  "--fail-fast",
  "--cache-dir",
  "ndjson",
  "::error",
  "forbid_secrets",
  "\\[sbom\\]",
  "--attest",
  "PLUGIN CHECKS",
]

[[file]]
path = "BENCHMARKS.md"
required = true
min_size_bytes = 1200
require_regex = ["Detailed Results", "deliver_vs_shell", "Reproducing"]

[[file]]
path = "ROADMAP.md"
required = true
min_size_bytes = 1200
require_regex = [
  "\\[x\\] Git commit message validation",
  "\\[x\\] Git branch validation",
  "\\[x\\] Parallel check execution \\(`--jobs`\\)",
  "\\[x\\] SARIF 2\\.1\\.0 output",
  "\\[x\\] JUnit XML output",
  "\\[x\\] Per-check weights",
  "\\[x\\] Conditional checks \\(`when`\\)",
  "\\[x\\] Incremental validation",
  "\\[x\\] Result caching keyed by file content hash",
  "\\[x\\] Early termination on first failure",
  "\\[x\\] Streaming NDJSON output",
  "\\[x\\] GitHub Actions inline annotations",
  "\\[x\\] Deliverable attestation bundle",
  "\\[x\\] Secret-pattern detection as a first-class check",
  "\\[x\\] SBOM presence/shape validation",
  "\\[x\\] Subprocess-protocol plugin check kind",
  "\\[x\\] Plugin documentation and examples",
  "\\[x\\] API stability guarantees",
  "\\[x\\] Documentation site",
  "\\[x\\] 1.0 release",
]

[[file]]
path = "docs/index.html"
required = true
require_regex = [
  "Plugin checks",
  "forbid_secrets",
  "sbom",
  "--attest",
  "--allow-commands",
  "Semantic Versioning",
]

[[file]]
path = "CHANGELOG.md"
required = true
min_size_bytes = 2000
require_regex = ["## 1.0.0", "Semantic Versioning", "plugin", "attestation"]

[[command]]
name = "cargo test"
cmd = ["cargo", "test"]
expect_exit = 0
timeout_secs = 300
stdout_contains = ["test result: ok"]

[[command]]
name = "cargo build"
cmd = ["cargo", "build"]
expect_exit = 0
timeout_secs = 300

[[command]]
name = "cargo clippy"
cmd = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
expect_exit = 0
timeout_secs = 300

[[command]]
name = "cargo fmt --check"
cmd = ["cargo", "fmt", "--", "--check"]
expect_exit = 0
timeout_secs = 60

[[command]]
name = "help lists output controls"
cmd = ["cargo", "run", "--", "--help"]
expect_exit = 0
timeout_secs = 300
stdout_contains = ["--color", "--progress", "--format"]
