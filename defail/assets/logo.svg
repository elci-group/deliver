<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DEFAIL logo">
  <!--
    DEFAIL mark: the pipeline as a circuit.
    A signal line enters (execution), dips through an amber square pulse
    (the failure), is resolved by a decision diamond (classification +
    causal inference + policy), and resumes as an arrow (verified resume).
    The slate stub below the diamond ends in a dot: deterministic
    escalation, the only other exit. Hand-authored, dependency-free.
  -->
  <rect x="6" y="6" width="500" height="500" rx="88" fill="#F8FAFC"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-8,-52)">
    <path d="M40 256 H150" stroke="#0F172A" stroke-width="28"/>
    <path d="M150 256 V316 H214 V256" stroke="#D97706" stroke-width="28"/>
    <path d="M214 256 H304" stroke="#0F172A" stroke-width="28"/>
    <path d="M348 212 L392 256 L348 300 L304 256 Z" stroke="#0F172A" stroke-width="24"/>
    <path d="M392 256 H436" stroke="#0F172A" stroke-width="28"/>
    <path d="M436 214 L490 256 L436 298" stroke="#0F172A" stroke-width="28"/>
    <path d="M348 300 V368" stroke="#64748B" stroke-width="24"/>
    <circle cx="348" cy="398" r="18" fill="#64748B" stroke="none"/>
  </g>
</svg>
