[package]
name = "deliver"
version = "0.2.0"
edition = "2021"
authors = ["Rory Spring-Vanhorne <rory.spring@icloud.com>"]
description = "Deterministic deliverable validator for agent workflows"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.10"
glob = "0.3"
sha2 = "0.10"
blake3 = "1.5"
jsonschema = "0.17"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"
criterion = "0.5"

[[bench]]
name = "validation"
harness = false
