# Rust app with a generated source file. src/generated.rs starts with a
# "Code generated" marker, so discovery classifies it Generated and string
# extraction skips it: the global OGMA-I18N-001 aggregate references only
# src/main.rs. The hard-coded strings are Warnings, so overall PASS.
# No catalogues and Latin-only strings: baseline undetected, working
# baseline en. fixture.toml itself is scanned as the locale-less baseline
# catalogue; self-comparison findings are filtered by the engine.
description = "Generated source file excluded from extraction; only src/main.rs in OGMA-I18N-001; PASS"

[expect]
baseline = "none"
baseline_confidence = "UNKNOWN"
locales = ["en"]
overall = "PASS"

[expect.native]
en = true

[expect.violations]
global = ["OGMA-I18N-001"]
en = []

[expect.violation_files]
"OGMA-I18N-001" = ["src/main.rs"]
