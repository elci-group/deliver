# JS app whose only user-facing strings are hard-coded Cyrillic Russian, with
# no catalogues at all. The baseline language is detected from the script of
# those strings: SourceStrings evidence is Medium (50), so ru wins with
# LIKELY confidence. The hard-coded strings produce a global OGMA-I18N-001
# Warning (which alone never fails an audit); ru is the baseline and is
# native. Overall PASS.
# Note: this fixture has no catalogue files, so the engine's catalogue
# discovery picks up fixture.toml itself as a (locale-less) TOML resource
# and uses it as the baseline linguistic surface. Baseline self-comparison
# findings (including OGMA-I18N-006) are filtered by the engine, so the ru
# report carries no violations; expectations encode the actual behavior.
description = "Hard-coded Cyrillic source strings, no catalogues; baseline ru detected from script; PASS"

[expect]
baseline = "ru"
baseline_confidence = "LIKELY"
locales = ["ru"]
overall = "PASS"

[expect.native]
ru = true

[expect.violations]
global = ["OGMA-I18N-001"]
ru = []

[expect.violation_files]
"OGMA-I18N-001" = ["src/app.js"]
