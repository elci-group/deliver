# All translation lookups use dynamic keys: t(dynamicKey) and a template
# literal t(`prefix.${name}`). The extractor only records literal
# arguments, so these calls produce no occurrences: no OGMA-I18N-001, no
# crash, no phantom keys, and source_keys stays empty, which disables
# orphan analysis (a non-empty source_keys set is what excuses keys).
# Baseline en via the fallbackLng hint; fr complete; allow_fallback admits
# fr -> en. Overall PASS.
description = "Dynamic-only t() keys: no extraction, no crash, orphan analysis skipped; PASS"

[policy]
allow_fallback = true

[expect]
baseline = "en"
baseline_confidence = "LIKELY"
locales = ["en", "fr"]
overall = "PASS"

[expect.native]
en = true
fr = true

[expect.violations]
global = []
en = []
fr = []
