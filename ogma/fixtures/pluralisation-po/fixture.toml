# gettext pair with valid Plural-Forms headers. The plural entry has both
# msgstr[0] and msgstr[1] filled in fr, so no OGMA-I18N-004. allow_fallback
# permits fr -> en. Baseline is undetected (Weak resource-naming tie between
# en and fr), the working baseline falls back to en.
description = "gettext with complete plural arms in fr; PASS under allow_fallback"

[policy]
allow_fallback = true

[expect]
baseline = "none"
baseline_confidence = "UNKNOWN"
locales = ["en", "fr"]
overall = "PASS"

[expect.native]
en = true
fr = true

[expect.violations]
global = []
en = []
fr = []
