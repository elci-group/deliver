# i18next app configured with fallbackLng "en-GB" and three regional
# catalogues (en-GB, en-US, fr-FR), all complete and mutually translated.
# Evidence: the fallbackLng hint is Medium (50) and resource naming is Weak,
# so en totals 70 vs fr 10: the baseline language is detected as en with
# LIKELY confidence (a fallbackLng hint is NOT Strong; baseline detection
# also reports a language, not a locale). The working baseline "en" is added
# to the locale set, sharing the en-GB catalogue. allow_fallback admits
# fr-FR -> en; en-US -> en is a regional fallback that passes even under the
# default policy.
description = "Regional locales en-GB/en-US/fr-FR complete; baseline en LIKELY via fallbackLng hint; PASS"

[policy]
allow_fallback = true

[expect]
baseline = "en"
baseline_confidence = "LIKELY"
locales = ["en", "en-GB", "en-US", "fr-FR"]
overall = "PASS"

[expect.native]
en = true
en-GB = true
en-US = true
fr-FR = true

[expect.violations]
global = []
en = []
en-GB = []
en-US = []
fr-FR = []
