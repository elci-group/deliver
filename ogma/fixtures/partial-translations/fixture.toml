# Same shape as complete-react but fr is incomplete: menu.help and
# menu.profile are missing (OGMA-I18N-002 x2), action.save was copied
# untranslated (OGMA-I18N-006), action.delete dropped the {name} placeholder
# (OGMA-I18N-005). Coverage 5/7 is below 1.0 (OGMA-I18N-012) and, under the
# default policy, fr -> en is an illegal cross-language fallback
# (OGMA-I18N-011). fr is non-native; overall FAIL.
description = "Incomplete fr catalogue: missing keys, untranslated value, placeholder mismatch; FAIL under the default policy"

[expect]
baseline = "en"
baseline_confidence = "LIKELY"
locales = ["en", "fr"]
overall = "FAIL"

[expect.native]
en = true

[expect.violations]
global = []
en = []
fr = ["OGMA-I18N-002", "OGMA-I18N-005", "OGMA-I18N-006", "OGMA-I18N-011", "OGMA-I18N-012"]
