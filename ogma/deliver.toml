[[file]]
path = "tests/harness/Cargo.toml"
required = true

[[file]]
path = "fixtures/complete-react/fixture.toml"
required = true

[[file]]
path = "fixtures/django-app/fixture.toml"
required = true

[[file]]
path = "fixtures/rtl-app/fixture.toml"
required = true

[[command]]
name = "workspace builds offline, warning-free"
cmd = ["cargo", "build", "--workspace", "--offline"]
expect_exit = 0
timeout_secs = 300
stderr_contains = ["Finished"]

[[command]]
name = "full test suite passes"
cmd = ["cargo", "test", "--workspace", "--offline"]
expect_exit = 0
timeout_secs = 300

[[command]]
name = "cli audit on conforming fixture passes"
cmd = ["cargo", "run", "-q", "-p", "ogma-cli", "--offline", "--", "audit", "--root", "fixtures/complete-react", "--policy", "policies/permissive.toml"]
expect_exit = 0
timeout_secs = 300
stdout_contains = ["Deterministic Multilingual Conformance", "Overall: PASSED"]

[[command]]
name = "cli check on violating fixture exits 1"
cmd = ["cargo", "run", "-q", "-p", "ogma-cli", "--offline", "--", "check", "--root", "fixtures/partial-translations"]
expect_exit = 1
timeout_secs = 300
stdout_contains = ["OGMA-I18N-002"]
