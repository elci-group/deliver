# Ogma v1 acceptance contract (directive §30 initial release, §31 definition of done)

[[file]]
path = "Cargo.toml"
required = true

[[file]]
path = "README.md"
required = true
min_size_bytes = 1000

[[file]]
path = "policies/strict.toml"
required = true

[[file]]
path = "policies/permissive.toml"
required = true

