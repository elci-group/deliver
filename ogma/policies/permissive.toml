# Ogma permissive policy — for applications that accept partial localisation:
# near-complete coverage, cross-language fallback and unknown-confidence
# checks are all tolerated. Useful for early-stage i18n rollouts.

[application]
baseline = "auto"

[locales]
required = []

[requirements]
# Near-complete coverage is accepted; the last few percent may fall back.
translation_coverage = 0.95
# Falling back to another primary language is acceptable (no OGMA-I18N-011).
allow_fallback = true
# All CLDR plural categories required by each locale must be implemented.
require_pluralisation = true
# Date/number/currency formatting must be locale-aware.
require_locale_formatting = true
# aria-labels and accessibility strings must flow through i18n.
require_accessibility = false
# UNKNOWN confidence may pass (lenient trust).
allow_unknown = true
