# Ogma strict policy — CI enforcement for applications that must prove
# native support for every declared language. A single cross-language
# fallback, missing translation, or placeholder mismatch fails the check.

[application]
# "auto" lets Ogma determine the baseline from weighted evidence; an
# explicit locale (e.g. "en-GB") overrides detection.
baseline = "auto"

[locales]
# Locales that MUST be natively supported. Missing locales fail the audit.
required = ["en-GB", "fr-FR", "de-DE"]

[requirements]
# Full translation coverage of the baseline linguistic surface.
translation_coverage = 1.0
# Any fallback to another primary language is a violation (OGMA-I18N-011).
allow_fallback = false
# All CLDR plural categories required by each locale must be implemented.
require_pluralisation = true
# Date/number/currency formatting must be locale-aware.
require_locale_formatting = true
# aria-labels and accessibility strings must flow through i18n.
require_accessibility = true
# UNKNOWN confidence must never pass (deterministic trust).
allow_unknown = false
