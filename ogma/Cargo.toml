[workspace]
resolver = "2"
members = ["crates/*", "tests/harness"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ogma-model = { path = "crates/ogma-model" }
ogma-locale = { path = "crates/ogma-locale" }
ogma-discovery = { path = "crates/ogma-discovery" }
ogma-parser = { path = "crates/ogma-parser" }
ogma-strings = { path = "crates/ogma-strings" }
ogma-policy = { path = "crates/ogma-policy" }
ogma-conformance = { path = "crates/ogma-conformance" }
ogma-report = { path = "crates/ogma-report" }
ogma-core = { path = "crates/ogma-core" }
ogma-integrations = { path = "crates/ogma-integrations" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
